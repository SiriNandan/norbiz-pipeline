const nok=v=>{
  if(v==null)return null;
  if(v<0)return`-NOK ${(Math.abs(v)/1e6).toFixed(1)}m`;
  if(v>=1e9)return`NOK ${(v/1e9).toFixed(2)}bn`;
  if(v>=1e6)return`NOK ${(v/1e6).toFixed(1)}m`;
  return`NOK ${Math.round(v).toLocaleString()}`;
};
const score=c=>(c.financials?3:0)+(c.employees!=null?1:0)+(c.website?1:0)+(c.roles.length?1:0);
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');

/* ── AGENT ───────────────────────────────────────────────────────────────── */
const agentAnswer=(q,c)=>{
  const lq=q.toLowerCase();
  const f=c.financials;
  const nr=`**not reported** in the available records for **${c.name}**`;
  if(/^(hi|hello|hey|hei)/.test(lq)) return`Hello! Ask me about **${c.name}** — revenue, employees, roles, address, or financials. I only use their registered data.`;
  if(/revenue|turnover|sales|income/.test(lq)) return f?.revenue!=null?`**${c.name}** reported revenue of **${nok(f.revenue)}** for ${f.year}. Source: Regnskapsregisteret.`:`Revenue is ${nr}.`;
  if(/profit|loss|annual.result|result/.test(lq)) return f?.result!=null?`**${c.name}** posted **${nok(f.result)}** annual result for ${f.year}. Source: Regnskapsregisteret.`:`Annual result is ${nr}.`;
  if(/operating|ebit|driftsresultat/.test(lq)) return f?.op!=null?`Operating result: **${nok(f.op)}** (${f.year}). Source: Regnskapsregisteret.`:`Operating result is ${nr}.`;
  if(/asset|balance|balansesum/.test(lq)) return f?.assets!=null?`Total assets: **${nok(f.assets)}** (${f.year}). Source: Regnskapsregisteret.`:`Asset data is ${nr}.`;
  if(/debt|liabilit|gjeld/.test(lq)) return f?.debt!=null?`Total debt/liabilities: **${nok(f.debt)}** (${f.year}). Source: Regnskapsregisteret.`:`Debt data is ${nr}.`;
  if(/employee|staff|headcount|ansatte/.test(lq)) return c.employees!=null?`**${c.name}** has **${c.employees} registered employees**. Source: Enhetsregisteret.`:`Employee count is ${nr}.`;
  if(/address|location|where|headquarter/.test(lq)) return`Registered address: **${c.address}** (${c.municipality}). Source: Enhetsregisteret.`;
  if(/industr|sector|nace|business/.test(lq)) return`Industry: **${c.industry}** (NACE ${c.industry_code}). Source: Enhetsregisteret.`;
  if(/website|url|web|site/.test(lq)) return c.website?`Registered website: **${c.website}** (self-declared in registry).`:`No website registered for **${c.name}**.`;
  if(/status|active|inactive/.test(lq)) return`**${c.name}** is **${c.status}**, registered since ${c.registered}. Source: Enhetsregisteret.`;
  if(/register|founded|established|when/.test(lq)) return`**${c.name}** was registered on **${c.registered}**. Source: Enhetsregisteret.`;
  if(/ceo|director|manager|chair|board|role|people|who/.test(lq)){
    if(!c.roles.length)return`No registered roles available for **${c.name}**.`;
    return`Roles at **${c.name}**:\n${c.roles.slice(0,5).map(r=>`• **${r.name}** — ${r.role}`).join('\n')}\nSource: Enhetsregisteret.`;
  }
  if(/org.number|orgnr|id|number/.test(lq)) return`Organisation number (orgnr): **${c.org}**. Source: Enhetsregisteret.`;
  const avail=['address','industry',`${c.roles.length} roles`];
  if(f)avail.push(`revenue (${nok(f.revenue)})`,`result (${nok(f.result)})`);
  if(c.employees!=null)avail.push(`employees (${c.employees})`);
  return`I can answer questions about: ${avail.join(', ')}. What would you like to know about **${c.name}**?`;
};

      if(fm!=='all'&&c.municipality!==fm)return false;
      if(fs!=='all'&&c.status!==fs)return false;
      return true;

      <main class="max-w-6xl mx-auto px-4 py-8" ref=${lookupRef}>
        <div class="flex flex-col sm:flex-row gap-3 mb-3">
          <input value=${search} onChange=${e=>setSearch(e.target.value)}
            placeholder="Search name, org number, municipality…"
            class="flex-1 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-200 bg-white"/>
          <select value=${sort} onChange=${e=>setSort(e.target.value)}
            class="border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-blue-400">
            <option value="complete">Most complete</option>
            <option value="revenue">Largest revenue</option>
            <option value="employees">Largest team</option>
            <option value="registered">Recently registered</option>
            <option value="alpha">A → Z</option>
          </select>
        </div>
        <div class="flex flex-wrap gap-2 mb-4">
          <select value=${fi} onChange=${e=>setFi(e.target.value)}
            class="border border-slate-200 rounded-lg px-3 py-2 text-xs bg-white focus:outline-none focus:border-blue-400">
            <option value="all">All industries</option>
            ${INDUSTRIES.map(i=>html`<option key=${i} value=${i}>${i.length>45?i.slice(0,45)+'…':i}</option>`)}
          </select>
          <select value=${fm} onChange=${e=>setFm(e.target.value)}
            class="border border-slate-200 rounded-lg px-3 py-2 text-xs bg-white focus:outline-none focus:border-blue-400">
            <option value="all">All municipalities</option>
            ${MUNIS.map(m=>html`<option key=${m} value=${m}>${m}</option>`)}
          </select>
          <select value=${fs} onChange=${e=>setFs(e.target.value)}
            class="border border-slate-200 rounded-lg px-3 py-2 text-xs bg-white focus:outline-none focus:border-blue-400">
            <option value="all">All statuses</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          ${hasFilter&&html`
            <button onClick=${clearAll}
              class="border border-slate-200 rounded-lg px-3 py-2 text-xs bg-white text-slate-500 hover:border-red-300 hover:text-red-500 transition-colors">
              Clear ×
            </button>`}
        </div>
        <div class="text-xs text-slate-400 font-mono mb-4">
          ${filtered.length} ${filtered.length===1?'company':'companies'} found${filtered.length<COMPANIES.length?` · ${COMPANIES.length-filtered.length} filtered`:''}
        </div>
        ${filtered.length===0?html`
          <div class="text-center py-16 text-slate-400">
            <div class="text-4xl mb-3">🔍</div>
            <div class="font-medium">No companies match your filters</div>
            <button onClick=${clearAll} class="mt-3 text-blue-500 hover:underline text-sm">Clear filters</button>
          </div>`:html`
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">
            ${filtered.map(c=>html`<${CompanyCard} key=${c.id} company=${c} onClick=${()=>setSelected(c)}/>`)}
          </div>`}
      </main>

      <${Method}/>
      <${Sources}/>

      <!-- FOOTER -->
      <footer class="bg-slate-900 text-slate-400 py-8 px-4">
        <div class="max-w-4xl mx-auto">
          <div class="flex justify-between items-start gap-4 mb-4 flex-wrap">
            <div>
              <div class="text-white font-bold text-lg">NorBiz</div>
              <div class="text-sm">Norwegian Company Intelligence</div>
            </div>
            <div class="text-xs font-mono text-slate-500 text-right">
              <div>Sample pulled: ${SD}</div>
              <div>${COMPANIES.length} fixture records · Signalpost project</div>
            </div>
          </div>
          <div class="border-t border-slate-800 pt-4 text-xs text-slate-500 leading-relaxed">
            <strong class="text-slate-400">Disclaimer:</strong> This is a dated fixture sample, not a continuously refreshed production service.
            Records were pulled from public Norwegian government registers (Brønnøysundregistrene) around ${SD}.
            Financial figures reflect the most recent available annual filing and may not reflect current conditions.
            Verify all material facts directly with the source registers before relying on this data.
          </div>
        </div>
      </footer>

      ${selected&&html`<${Drawer} company=${selected} onClose=${()=>setSelected(null)}/>`}
    </div>`;
}

createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
